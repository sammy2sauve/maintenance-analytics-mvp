name: Refresh Demo Dates

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:      # Allow manual trigger from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Roll demo data dates forward
        run: |
          body=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            https://maintenance-analytics-mvp.onrender.com/admin/refresh-demo-dates)
          http_status=$(echo "$body" | grep "HTTP_STATUS:" | cut -d: -f2)
          response_body=$(echo "$body" | grep -v "HTTP_STATUS:")
          echo "HTTP status: $http_status"
          echo "Response: $response_body"
          if [ "$http_status" != "200" ]; then
            echo "Refresh failed"
            exit 1
          fi
